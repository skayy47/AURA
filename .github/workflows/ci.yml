name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ── Backend ──────────────────────────────────────────────────────────────
  backend:
    name: Backend — ruff · black · pytest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: AURA-BACKEND

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: AURA-BACKEND/requirements.txt

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff black pytest

      - name: Ruff lint
        run: ruff check . --select E,F,W --ignore E501

      - name: Black format check
        run: black --check .

      - name: Pytest
        env:
          ANTHROPIC_API_KEY: "sk-test-placeholder"
          OPENAI_API_KEY: "sk-test-placeholder"
        run: python -m pytest ../tests -v --tb=short

  # ── Frontend ─────────────────────────────────────────────────────────────
  frontend:
    name: Frontend — tsc · next build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: AURA-FRONTEND

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: AURA-FRONTEND/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript type check
        run: npx tsc --noEmit

      - name: Next.js build
        env:
          NEXT_PUBLIC_API_URL: "http://localhost:8000"
        run: npm run build

  # ── Playwright smoke ──────────────────────────────────────────────────────
  e2e:
    name: E2E smoke — Playwright
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: AURA-BACKEND/requirements.txt

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: AURA-FRONTEND/package-lock.json

      - name: Install backend
        working-directory: AURA-BACKEND
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          playwright install chromium --with-deps

      - name: Install frontend
        working-directory: AURA-FRONTEND
        run: npm ci

      - name: Start backend (background)
        working-directory: AURA-BACKEND
        run: uvicorn main:app --host 127.0.0.1 --port 8000 &
        env:
          ANTHROPIC_API_KEY: "sk-test-placeholder"

      - name: Build + start frontend (background)
        working-directory: AURA-FRONTEND
        run: |
          npm run build
          npm start &
        env:
          NEXT_PUBLIC_API_URL: "http://localhost:8000"

      - name: Wait for services
        run: |
          npx wait-on http://localhost:8000/health http://localhost:3000 --timeout 60000

      - name: Playwright smoke test
        working-directory: AURA-FRONTEND
        run: npx playwright test --reporter=list
        env:
          BASE_URL: "http://localhost:3000"

  # ── Deploy gate ───────────────────────────────────────────────────────────
  deploy-gate:
    name: Deploy gate
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: github.ref == 'refs/heads/main'
    steps:
      - name: All checks passed
        run: echo "✅ Backend lint+tests and frontend typecheck+build all green."
